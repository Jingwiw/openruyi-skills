project:
  name: sanitized-codex-skills-distro-bundle
  version: 1
  generated_by: tools/export_from_codex.sh
  source_root_env: CODEX_SKILLS_ROOT
  default_source_root: ~/.codex/skills

included_skills:
  - name: openruyi-obs-validation
    export:
      - SKILL.md
      - scripts/render_package_meta.sh
      - scripts/render_service.sh
      - scripts/scan_sysusers_logs.sh
      - scripts/sync_project.sh
      - scripts/wipe_rebuild.sh
  - name: distro-analysis-skill
    export:
      - SKILL.md
      - agents/openai.yaml
      - references/distro-source-playbook.md
  - name: todo-skill
    export:
      - SKILL.md
      - agents/openai.yaml
      - references/task-doc-templates.md
  - name: commit-spec-skill
    export:
      - SKILL.md
      - agents/openai.yaml
      - references/commit-templates.md
  - name: rust-dev-lead-skill
    export:
      - SKILL.md
      - agents/openai.yaml
      - references/rust-quality-checklist.md

sanitization:
  strategy:
    - keep generic workflow structure
    - replace instance-specific identifiers with macros
    - preserve executable shell scripts when practical
  macros_doc: MACROS.md

